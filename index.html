<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic&nbsp;Tac&nbsp;Toe — Vanilla JS</title>
<meta name="description" content="A polished, accessible Tic-Tac-Toe built with vanilla HTML, CSS and JavaScript. Features an unbeatable minimax CPU, score tracking and keyboard support." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene" aria-hidden="true"></div>

  <main class="app">

    <header class="app-header">
      <p class="eyebrow">Vanilla JS &middot; No frameworks</p>
      <h1 class="title">Tic<span class="title-x">Tac</span>Toe</h1>
    </header>

    <section class="mode-row" aria-label="Game mode">
      <div class="segmented" id="modeSegmented" role="tablist" aria-label="Choose game mode">
        <button class="seg-btn is-active" type="button" data-mode="pvp" role="tab" aria-selected="true">2 Players</button>
        <button class="seg-btn" type="button" data-mode="cpu" role="tab" aria-selected="false">Vs CPU</button>
      </div>
      <button class="icon-btn" id="soundToggle" type="button" aria-pressed="true" aria-label="Toggle sound effects" title="Toggle sound">
        <svg id="soundOnIcon" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".6"/></svg>
        <svg id="soundOffIcon" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </section>

    <section class="status-bar" aria-live="polite">
      <span class="turn-dot" id="turnDot" aria-hidden="true"></span>
      <span class="status-text" id="statusText">X's turn</span>
    </section>

    <section class="board-wrap">
      <div class="board" id="board">
        <button class="cell" type="button" data-index="0" aria-label="Row 1, Column 1"></button>
        <button class="cell" type="button" data-index="1" aria-label="Row 1, Column 2"></button>
        <button class="cell" type="button" data-index="2" aria-label="Row 1, Column 3"></button>
        <button class="cell" type="button" data-index="3" aria-label="Row 2, Column 1"></button>
        <button class="cell" type="button" data-index="4" aria-label="Row 2, Column 2"></button>
        <button class="cell" type="button" data-index="5" aria-label="Row 2, Column 3"></button>
        <button class="cell" type="button" data-index="6" aria-label="Row 3, Column 1"></button>
        <button class="cell" type="button" data-index="7" aria-label="Row 3, Column 2"></button>
        <button class="cell" type="button" data-index="8" aria-label="Row 3, Column 3"></button>
        <svg class="win-line" id="winLine" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
          <line id="winLineEl" x1="0" y1="0" x2="0" y2="0" />
        </svg>
      </div>
    </section>

    <section class="scoreboard" aria-label="Score">
      <div class="score-tile tile-x">
        <span class="score-label">X</span>
        <span class="score-value" id="scoreX">0</span>
      </div>
      <div class="score-tile tile-draw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDraw">0</span>
      </div>
      <div class="score-tile tile-o">
        <span class="score-label" id="oLabel">O</span>
        <span class="score-value" id="scoreO">0</span>
      </div>
    </section>

    <section class="controls">
      <button class="btn btn-primary" id="newRoundBtn" type="button">New round</button>
      <button class="btn btn-ghost" id="resetMatchBtn" type="button">Reset match</button>
    </section>

    <footer class="app-footer">
      <p>Built with HTML, CSS &amp; JavaScript — CPU opponent uses the minimax algorithm.</p>
    </footer>

  </main>

  <div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
